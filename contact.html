<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | LamigsaUmaga'tGabi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <nav class="bg-blue-900 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold">LamigsaUmaga'tGabi</a>
      <div class="space-x-4">
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <header class="bg-blue-100 py-12 text-center">
    <h1 class="text-4xl font-bold">Get in Touch</h1>
    <p class="mt-2 text-lg text-blue-900">We'd love to hear from you</p>
  </header>

  <section class="container mx-auto py-12 px-6">
    <form class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 max-w-xl mx-auto">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Name</label>
        <input class="w-full px-3 py-2 border rounded" type="text" placeholder="Your Name" required />
      </div>
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
        <input class="w-full px-3 py-2 border rounded" type="email" placeholder="you@example.com" required />
      </div>
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Message</label>
        <textarea class="w-full px-3 py-2 border rounded" rows="4" placeholder="Your message..." required></textarea>
      </div>
      <div class="text-center">
        <button class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded">Send</button>
      </div>
    </form>
  </section>

  <footer class="bg-blue-900 text-white text-center p-4">
    &copy; 2025 LamigsaUmaga'tGabi. All rights reserved.
  </footer>

</body>
</html>
